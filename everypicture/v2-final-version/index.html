<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Every Picture Final Version</title>

    <!-- normalize -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">

    <!-- link to style -->
    <link rel="stylesheet" href="styles.css">

    <!-- link to javascript -->
     <script src="script.js" defer></script>
</head>
<body>
    
    <header>
        <h1>camping<br>memories</h1>
    </header>

    <main>
        
        <!-- the horizon (both night & day) -->
        <img id="day" src="images/dayhorizon.png" alt="an illustrated view of some mountains on the horizon during day" width="1200">
        <img id="daysky" src="images/daysky.png" alt="a nice blue sky" width="1200">
        <img id="sun" src="images/sun.png" alt="the sun" width="100">
        <img id="night" src="images/nighthorizon.png" alt="an illustrated view of some mountains on the horizon during night" width="1200">
        <img id="nightsky" src="images/nightsky.png" alt="a nice night sky" width="1200">
        <img id="moon" src="images/moon.png" alt="the moon" width="150">

        <!-- upper half -->
        <section id="picnic">
            <img src="images/image4.png" alt="people at a picnic table making sandwiches" width="500">
        </section>

        <div id="grass1">
            <img src="images/foliage-3.png" alt="a small grass patch hill" width="600">
        </div>

        <div id="treebush">
            <img src="images/foliage-4.png" alt="illustrated tree and bush" width="300">
        </div>

        <section id="lake" class="picture">
            <img src="images/image6.png" alt="kids in a tube on the lake" width="250">
        </section>

        <section id="bear" class="picture">
            <img src="images/image7.png" alt="a bear" width="200">
        </section>

        <div id="grass2">
            <img src="images/foliage-1.png" alt="another small grass patch hill" width="600">
        </div>

        <section id="smokey" class="picture">
            <img src="images/image5.png" alt="me posing with smokey bear" width="150">
        </section>

        <section id="mountain" class="picture">
            <img src="images/image2.png" alt="a fire lookout atop a mountain" width="300">
        </section>


        <!-- bottom section -->
        <div id="grass3">
            <img src="images/foliage-2.png" alt="again another small grass patch hill" width="600">
        </div>

        <div id="treebush2">
            <img src="images/foliage-5.png" alt="a cutout of a redwood tree and some illustrated trees" width="300">
        </div>

        <section id="firepit" class="picture">
            <img src="images/image1.png" alt="my family cooking hot dogs around a firepit" width="250">
        </section>

        <section id="pawprints" class="picture">
            <img src="images/image3.png" alt="me pointing out some paw prints i found on a table at night" width="250">
        </section>

        <!-- overlay -->
        <div id="overlay" class="hidden" >
            <article>
                <h2>overlay content here</h2>
                <p>some text here</p>
                <img src="#">
                <button class="close">close</button>
            </article>
        </div>

    </main>

    <footer>
        <p>coded by <a href="../../index.html">karley makar</a></p>
    </footer>
    
</body>
</html>
