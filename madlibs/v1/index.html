<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mad Libs Code Version 1</title>

    <!-- normalize -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <!-- fonts -->
    <link rel="stylesheet" href="https://use.typekit.net/qzf6vvp.css">

    <!-- link to style -->
    <link rel="stylesheet" href="styles.css">

    <!-- link to js -->
     <script src="script.js" defer></script>

</head>

<body>

    <header>
        <h1>What's in Your Pocket?</h1>
        <h2>Fill out the form to find out.</h2>

        

    </header>

    <main>
        <img id="person" src="images/person.png" width=370px alt="person inquisitively looks down at their pocket when they notice something is moving inside it">

        <section id="madlib-questions1" class="madlib-questions">
            <form>
                <label for="exclaimation">Exclaimation:</label>
                <input id="exclaimation" type="text" required>
                
                <label for="name">Name:</label>
                <input id="name" type="text" required>
                
                <label for="city">City:</label>
                <input id="city" type="text" required>
                
                <label for="adjective1">Adjective:</label>
                <input id="adjective1" type="text" required>
                
                <label for="noun1">Noun:</label>
                <input id="noun1" type="text" required>
                
                <label for="animal">Animal:</label>
                <input id="animal" type="text" required>
                
                <label for="job">Job:</label>
                <input id="job" type="text" required>
                
                <label for="adjective2">Adjective:</label>
                <input id="adjective2" type="text" required>
               
                <label for="noun2">Noun:</label>
                <input id="noun2" type="text" required>
                
                <label for="food">Food:</label>
                <input id="food" type="text" required>

                <button type="submit" value="next">Next</button>
            </form>
        </section>

        <section id="madlib-questions2" class="madlib-questions">
            <form>
                <label for="noun3">Noun:</label><input type="text" required>
                <label for="tvshow">TV Show:</label><input type="text" required>
                <label for="sounding">Sound + ing:</label><input type="text" required>
                <label for="number1">Number:</label><input type="text" required>
                <label for="verb">Verb:</label><input type="text" required>
                <label for="adjective3">Adjective:</label><input type="text" required>
                <label for="noun4">Noun:</label><input type="text" required>
                <label for="number2">Number:</label><input type="text" required>
                <label for="pluralnoun">Plural noun:</label><input type="text" required>
                <button type="submit" value="Submit">Submit</button>
            </form>
        </section>


    </main>







    
</body>

</html>
