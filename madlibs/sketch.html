<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madlibs Sketch</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&family=Londrina+Sketch&display=swap" rel="stylesheet">

    <style>
        
        * {
            box-sizing:border-box;
        }

        img {
            display:block;
        }

        html {
            background-image:url(images/hip-square.jpg);
        }

        body {
            height:100%;
            margin:auto;
            width:600px;
        }

        h1 {
            font-family: "Faculty Glyphic";
            text-align:center;
            color:navy;
            font-size: 32px;
            margin-bottom:80px;
        }

        #container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            grid-gap: 10px; 
            padding-bottom: 20px;
            display:flex;
            flex-wrap:wrap;
            margin:auto;
        }
        
        .row {
            align-content:right;
            flex:25%;
            
        }
        
        



    </style>

</head>
<body>
    <header>
        <h1>MadLibs Sketch</h1>
    </header>

    <div id="container">
        <img src="images/Frame 1.jpg" width="270" class="row">
        <img src="images/Frame 2.jpg" width="270" class="row">
        <img src="images/Frame 3.jpg" width="270" class="row">
        <img src="images/Frame 4.jpg" width="270" class="row">
    </div>

    
</body>
</html>
