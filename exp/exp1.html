    <script>
        /* This program runs 100 numbers through a for loop, but uses if statements to determine if the number is divisible by both 3 and 5 it writes the string Beep Boop. If only divisible by 3, it writes Beep, and if only divisible by 5, it writes Boop. */
        
        // a sequence
        var userNum = 0; 
        
        // a loop
        for (var i=0; i <= 100; i++) {
            // a selection
            if(i % 3 === 0 && i % 5 === 0) {
            console.log('Beep '+'Boop');
        } else if (i % 3 === 0 ) {
            console.log('Beep');
        } else if (i % 5 === 0) {
            console.log('Boop'); 
        } else {
            console.log(i);
        }
        }

    </script>
