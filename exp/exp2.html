<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 2</title>

    <style>

        html {
            background-image: url(images/stardust.png);
        }

        body {
            color:aliceblue;
            text-align:center;
            font-family: "Faculty Glyphic";
        }

        img {
            filter:drop-shadow(0 0 10px #fff);
        }

        

    </style>
</head>
<body>
    <h1>Experiment 2</h1>

    <p>help! i'm stuck on one of our four neighboring planets in our solar system. guess which one it is.</p>

    <div id="img"></div>

    <script>
        //this code generates a random planet out of an array (var planets) and prompts the user to guess which planet it has chosen. the random is generated through function randomInt which uses Math.floor. the function checkPlanet() does the main work. document.querySelector is used to target the p and img div in the html. then, the if statements change the innerHTML depending on which outcome occurs. there is another if statement nested in the else if (userPlanet === planet) to decide the image to be shown on the screen depending on which planet is chosen and matched. i added this to make jupiter larger on the screen than the other planets. lastly, the function is called in checkPlanet()


        function randomPlanet() {
            var planets = ['mercury','venus','mars','jupiter','pluto'];
            var pickedPlanet = planets[randomInt(0,4)];
            console.log(pickedPlanet);

            return pickedPlanet;
        }

        function randomInt (min,max) {
            return Math.floor ((max - min + 1) * Math.random()) + min;
        }


        var userPlanet = prompt ("help! i'm stuck on one of our four neighboring planets in our solar system. guess which one it is.", "");
        var planet = randomPlanet();

        if (userPlanet) {
            userPlanet = userPlanet.toLowerCase();
        }

        function checkPlanet() {
            
            var p = document.querySelector('p');
            var img = document.querySelector('div');
            

            if (!userPlanet || userPlanet === '' || userPlanet === null) {
                p.innerHTML = "what planet is that? is it a new discovery?";
                img.innerHTML = '<img src="images/question.png" width=200px>';
            } else if (userPlanet === 'pluto') {
                p.innerHTML = "hey, that's not technically a planet. but you can try again."
                img.innerHTML = '<img src="images/pluto.png">';
            } else if (userPlanet === planet) {
                p.innerHTML = 'you guessed it! i am actually stuck though. would you mind helping me get back?';
                if (planet === 'jupiter') {
                    img.innerHTML = `<img src="images/jupiter.png" width=500px>`;
                } else {
                img.innerHTML = `<img src="images/${planet}.png" width=200px>`;
                }
            } else {
                p.innerHTML = 'oh no, wrong one! but you can try again.';
                img.innerHTML = '';
            }
         }

        checkPlanet();


    </script>



</body>
</html>
